name: Metrics Telemetry 📊

on:
  schedule:
    - cron: "0 0 * * *"   # runs every midnight
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Lowlighter Metrics Telemetry
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Vikhyath-thelazycoder
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          filename: github-metrics.svg

          # Isometric 3D calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Deep Language breakdown
          plugin_languages: yes
          plugin_languages_analysis_details: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14

          # Habits & Activity heatmap
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Achievements shelf
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          # Lines of code
          plugin_lines: yes
          plugin_lines_history_limit: 1
